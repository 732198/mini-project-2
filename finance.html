<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="finance.css" />
</head>
<body>

  <div class="wrap">
    <header class="site-header">
      <div>
        <h1>Finance Tracker</h1>
        <p class="subtitle">Track spending. Stay on budget.</p>
      </div>
      <button class="btn btn-danger" id="reset-btn">Reset month</button>
    </header>

    <div class="metrics-grid">
      <div class="metric">
        <span class="metric-label">Total budgeted</span>
        <span class="metric-val" id="m-budget">$0.00</span>
      </div>
      <div class="metric">
        <span class="metric-label">Total spent</span>
        <span class="metric-val" id="m-spent">$0.00</span>
      </div>
      <div class="metric">
        <span class="metric-label">Remaining</span>
        <span class="metric-val" id="m-remaining">$0.00</span>
      </div>
    </div>

    <div class="two-col">

      <section class="card" aria-label="Set budget">
        <h2>Set budget</h2>
        <div class="field">
          <label for="b-cat">Category</label>
          <select id="b-cat"></select>
        </div>
        <div class="field">
          <label for="b-amt">Monthly limit ($)</label>
          <input type="number" id="b-amt" placeholder="e.g. 400" min="0" step="1" />
        </div>
        <button class="btn btn-primary" id="set-budget-btn">Save budget</button>
        <p class="field-err" id="b-err" aria-live="polite"></p>
      </section>



      <section class="card" aria-label="Log expense">
        <h2>Log expense</h2>
        <div class="field">
          <label for="e-amt">Amount ($)</label>
          <input type="number" id="e-amt" placeholder="e.g. 12.50" min="0.01" step="0.01" />
        </div>
        <div class="field">
          <label for="e-cat">Category</label>
          <select id="e-cat"></select>
        </div>
        <div class="field">
          <label for="e-note">Note <span class="optional">(optional)</span></label>
          <input type="text" id="e-note" placeholder="e.g. Grocery run" maxlength="60" />
        </div>
        <button class="btn btn-primary" id="add-expense-btn">Add expense</button>
        <p class="field-err" id="e-err" aria-live="polite"></p>
      </section>

    </div>


    <section class="card" aria-label="Budget breakdown">
      <h2>Budget breakdown</h2>
      <div id="cat-list">
        <p class="empty">Set a budget to get started.</p>
      </div>
    </section>


    <section class="card" aria-label="Expense log">
      <h2>Expense log</h2>
      <div id="exp-list">
        <p class="empty">No expenses yet.</p>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
